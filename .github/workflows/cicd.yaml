name: Local Model Pipeline

on:
  push:
    branches:
      - main

jobs:
  local-model-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # Executes your DVC workflow pipelines locally
      - name: Run DVC pipeline
        run: |
          dvc repro

      - name: Configure Git
        run: |
         git config --global user.name "github-actions[bot]"
         git config --global user.email "github-actions[bot]@://github.com"

      - name: Add changes to Git
        run: |
          git add .

      # Crucial: [skip ci] stops GitHub from spinning up a recursive loop run
      - name: Commit changes
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          git commit -m "Automated commit of DVC metrics [skip ci]" || echo "No changes to commit"

      - name: Push changes
        if: ${{ github.actor != 'github-actions[bot]' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin ${{ github.ref_name }}

      # Local validation steps
      - name: Run model loading test
        run: |
          pytest scripts/test_load_model.py

      - name: Run model signature test
        run: |
          pytest scripts/test_model_signature.py

      - name: Run model performance test
        run: |
          pytest scripts/test_model_performance.py

      # Registers and promotes the model within your MLflow environment
      - name: Promote model locally
        run: python scripts/promote_model.py
